[versions]
# Core build tooling
agp = "9.4.1"
kotlin = "2.4.21"

# Android SDK levels
android-compileSdk = "37"
# Minor SDK release, Compose 1.13 needs at least 37.1
android-compileSdkMinor = "2"
android-targetSdk = "37"
android-minSdk = "24"
android-wear-minSdk = "30"

# Multiplatform Compose and navigation
kotlinx-browser = "0.5.0"
# Pre-release on purpose: newest Compose and Material 3 Expressive design state
compose-multiplatform = "1.13.0-beta01"
kotlinx-coroutines = "1.11.0"
# Pre-release on purpose: Material 3 Expressive, matching Compose Multiplatform 1.13.0-beta01
compose-material3 = "1.13.0-beta01"
# Alpha on purpose like Material 3: list-detail scenes for Navigation 3
compose-material3-adaptive = "1.4.0-alpha01"
jetbrains-navigation3 = "1.2.0"
jetbrains-lifecycle = "2.11.0"
# Same version Navigation 3 brings along
jetbrains-navigationevent = "1.1.0"
kotlinx-serialization = "1.11.0"

# Theming
materialkolor = "5.0.1"

# Networking
ktor = "3.6.0"

# Storage (Android only, credentials)
androidx-datastore = "1.2.1"
# Local database of the Grocy data, Android and web (3.0.x stable, not the 3.1 alphas)
androidx-room3 = "3.0.3"
androidx-sqlite = "2.7.1"
# Not tied to the Kotlin version since KSP 2.3
ksp = "2.3.12"
# npm package of the web database worker, used via npm() in Gradle
npm-sqlite-wasm = "3.53.4-build2"

# Android runner entry point
androidx-activity = "1.13.0"
# Newer than JetBrains' navigationevent on Android: 1.2.0 ignores events sent to removed inputs
androidx-navigationevent = "1.2.0"
androidx-core-splashscreen = "1.2.0"

# Barcode scanning
androidx-camera = "1.6.2"
zxing = "3.5.4"
mlkit-barcode-scanning = "17.3.0"

# In-app updates of the Play app
play-app-update = "2.1.0"
# npm package for the web scanner, used via npm() in Gradle, not a Maven artifact
npm-zxing-wasm = "3.1.5"

# Wear OS
androidx-wear-compose = "1.7.1"

# Testing
turbine = "1.2.1"

[libraries]
# Multiplatform Compose runtime and UI
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }

# Theming
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }

# State management and serialization
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrains-lifecycle" }
jetbrains-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "jetbrains-lifecycle" }

# Navigation 3 for Compose Multiplatform (brings the matching navigation3-runtime)
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jetbrains-navigation3" }
compose-material3-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "compose-material3-adaptive" }
jetbrains-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "jetbrains-navigationevent" }

# Networking
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }

# Storage
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "androidx-room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidx-room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
# Desktop builds of the bundled SQLite, only its native libraries for JVM host tests
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "androidx-sqlite" }
androidx-sqlite-web = { module = "androidx.sqlite:sqlite-web", version.ref = "androidx-sqlite" }

# Android application host dependencies
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidx-navigationevent" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }

# Browser APIs for Kotlin/Wasm (HTMLVideoElement for the web scanner)
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }

# Barcode scanning: camera (Android)
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "androidx-camera" }

# Barcode scanning: decoders
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# Closed source, only for core:scanner-mlkit and android-play
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode-scanning" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Build logic (convention plugins)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room3-gradlePlugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "androidx-room3" }

# Wear OS UI
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "androidx-wear-compose" }
androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "androidx-wear-compose" }

[plugins]
# Core plugins
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "androidx-room3" }

# Convention plugins (build-logic)
grocy-kmp-library = { id = "grocy.kmp.library" }
grocy-kmp-compose = { id = "grocy.kmp.compose" }
grocy-android-application = { id = "grocy.android.application" }
grocy-web-application = { id = "grocy.web.application" }
grocy-room = { id = "grocy.room" }
grocy-sqlite-host-tests = { id = "grocy.sqlite.host.tests" }
