# The web app of Grocy KMP. It only serves files: the browser talks to the Grocy server itself.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The manifest is missing in nginx's list of types
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Wasm and JavaScript are most of the download and shrink to a quarter
    gzip on;
    gzip_comp_level 6;
    gzip_types application/wasm application/javascript application/json
        application/manifest+json image/svg+xml text/css text/plain;

    # Asked before every use, so a new release shows up; the service worker keeps it offline
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }

    # Named after their content, so they never change
    location ~ "^/[0-9a-f]{20}\.(wasm|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
